name: Build and Release

on:
  push:
    branches:
      - master
      - "release/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-22.04
    outputs:
      build-ref: ${{ steps.metadata.outputs.build-ref }}
      package-version: ${{ steps.metadata.outputs.package-version }}
      release-tag: ${{ steps.metadata.outputs.release-tag }}
    steps:
      - name: Resolve source and release tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          build_ref="${GITHUB_SHA}"
          package_version="${GITHUB_SHA}"
          release_tag=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            build_ref="${GITHUB_REF_NAME}"
            package_version="${GITHUB_REF_NAME}"
            release_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            release_tag="${GITHUB_REF#refs/heads/release/}"
            build_ref="${release_tag}"
            package_version="${release_tag}"
          fi
          echo "build-ref=${build_ref}" >> "${GITHUB_OUTPUT}"
          echo "package-version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "release-tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  linux-x64:
    name: Linux x64
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.build-ref }}

      - name: Check tag matches source version
        if: needs.prepare.outputs.release-tag != ''
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(sed -n 's/.*Version::version("\([^"]*\)").*/\1/p' src/core/version.cpp)"
          test "v${source_version}" = "${RELEASE_TAG}"

      - name: Build and test static Linux binary
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/src" \
            --workdir /src \
            alpine:3.22 \
            sh -euxc '
              apk add --no-cache \
                bash boost-dev boost1.84-static build-base cmake curl file netcat-openbsd ninja \
                openssl openssl-dev openssl-libs-static python3
              cmake -S . -B build-linux -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXE_LINKER_FLAGS=-static \
                -DBoost_USE_STATIC_LIBS=ON \
                -DDEFAULT_CONFIG=config.json \
                -DENABLE_MYSQL=OFF \
                -DOPENSSL_USE_STATIC_LIBS=TRUE \
                -DSYSTEMD_SERVICE=OFF
              cmake --build build-linux --parallel
              ctest --test-dir build-linux --output-on-failure
              strip build-linux/trojan
              file build-linux/trojan | grep -q "statically linked"
            '

      - name: Package Linux release
        shell: bash
        run: |
          set -euo pipefail
          package="trojan-${PACKAGE_VERSION}-linux-x64"
          mkdir -p "package/${package}"
          cp build-linux/trojan "package/${package}/trojan"
          cp -R examples "package/${package}/examples"
          cp CONTRIBUTORS.md LICENSE README.md "package/${package}/"
          cp examples/server.json-example "package/${package}/config.json"
          tar -C package -czf "${package}.tar.gz" "${package}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: trojan-*-linux-x64.tar.gz
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    needs: prepare
    runs-on: windows-2022
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.build-ref }}

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: windows-vcpkg-x64-static-v2

      - name: Install static dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            boost-asio:x64-windows-static `
            boost-date-time:x64-windows-static `
            boost-program-options:x64-windows-static `
            boost-property-tree:x64-windows-static `
            boost-system:x64-windows-static `
            openssl:x64-windows-static

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: windows-vcpkg-x64-static-v2

      - name: Configure Windows build
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DBoost_INCLUDE_DIR="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/include" `
            -DBoost_USE_STATIC_LIBS=ON `
            -DENABLE_MYSQL=OFF `
            -DOPENSSL_USE_STATIC_LIBS=TRUE

      - name: Build and test Windows binary
        shell: pwsh
        run: |
          & cmake --build build-windows --config Release --parallel --verbose `
            2>&1 | Tee-Object -FilePath build-windows/windows-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $message = (Get-Content build-windows/windows-build.log -Tail 60) -join "`n"
            $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows build failed::$message"
            exit $buildExitCode
          }
          ctest --test-dir build-windows -C Release --output-on-failure
          & "build-windows/Release/trojan.exe" --version

      - name: Package Windows release
        shell: pwsh
        run: |
          $package = "trojan-$env:PACKAGE_VERSION-windows-x64"
          New-Item -ItemType Directory -Force -Path "package/$package" | Out-Null
          Copy-Item "build-windows/Release/trojan.exe" "package/$package/trojan.exe"
          Copy-Item -Recurse -Path examples -Destination "package/$package/examples"
          Copy-Item -Path @("CONTRIBUTORS.md", "LICENSE", "README.md") -Destination "package/$package/"
          Copy-Item examples/client.json-example "package/$package/config.json"
          Compress-Archive -Path "package/$package" -DestinationPath "$package.zip" -CompressionLevel Optimal

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: trojan-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: needs.prepare.outputs.release-tag != ''
    needs:
      - prepare
      - linux-x64
      - windows-x64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          path: dist

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" dist/* \
            --generate-notes \
            --title "Trojan ${RELEASE_TAG}" \
            --verify-tag
